  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Mac Remote 首页">
        <span class="brand-mark"><svg><use href="#i-remote"/></svg></span>
        <span>Mac Remote</span>
      </a>
      <button class="connection-status" id="connection-status" type="button" title="重新检查连接"><span class="status-dot" aria-hidden="true"></span><span id="connection-label">连接中</span></button>
    </header>

    <main>
      <section class="device-card" aria-label="当前应用">
        <span class="device-icon"><img id="frontmost-app-icon" alt="" width="44" height="44" hidden><svg id="app-icon-fallback"><use href="#i-monitor"/></svg></span>
        <div class="device-info"><p id="frontmost-app">连接中…</p><span class="window-title" id="frontmost-window-title" hidden></span></div>
      </section>

      <div class="permission-banner" id="permission-banner" role="status" hidden><svg><use href="#i-lock"/></svg><p>请在 Mac 菜单栏中授予辅助功能权限</p></div>

      <div class="controls-layout">
        <section class="panel remote-panel" aria-label="播放遥控器">
          <div class="mode-switch" role="tablist" aria-label="控制模式">
            <button id="mode-keyboard" class="mode active" type="button" role="tab" aria-selected="true" aria-controls="remote-controls"><svg><use href="#i-key"/></svg>快捷键</button>
            <button id="mode-media" class="mode" type="button" role="tab" aria-selected="false" aria-controls="remote-controls" tabindex="-1"><svg><use href="#i-play"/></svg>媒体按键</button>
          </div>

          <div id="remote-controls" role="tabpanel" aria-labelledby="mode-keyboard">
            <div class="remote-pad" id="remote-pad">
              <div class="pad-ring"></div>
              <button class="pad-button pad-up" id="pad-up" data-control="volume" aria-label="音量增加 10%" disabled><span class="pad-content"><svg><use href="#i-plus"/></svg><span>10%</span></span></button>
              <button class="pad-button pad-left" id="pad-left" data-control="keyboard" aria-label="快退，发送左箭头" disabled><span class="pad-content"><svg><use id="left-icon" href="#i-back"/></svg><span id="left-label">5 秒</span></span></button>
              <button class="play-button" id="pad-play" data-control="keyboard" aria-label="播放或暂停" disabled><svg><use href="#i-play"/></svg></button>
              <button class="pad-button pad-right" id="pad-right" data-control="keyboard" aria-label="快进，长按持续发送右箭头" disabled><span class="pad-content"><svg><use id="right-icon" href="#i-forward"/></svg><span id="right-label">5 秒</span></span></button>
              <button class="pad-button pad-down" id="pad-down" data-control="volume" aria-label="音量降低 10%" disabled><span class="pad-content"><svg><use href="#i-minus"/></svg><span>10%</span></span></button>
            </div>
            <p class="hold-hint" id="hold-hint" title="需要播放器支持按住右箭头倍速"><span id="hold-text">长按倍速</span></p>
          </div>

          <div class="shortcut-grid" id="shortcut-grid">
            <button data-key="previous" data-control="keyboard" disabled><svg><use href="#i-prev"/></svg><span>上一个</span><kbd>[</kbd></button>
            <button data-key="next" data-control="keyboard" disabled><svg><use href="#i-next"/></svg><span>下一个</span><kbd>]</kbd></button>
            <button data-key="danmaku" data-control="keyboard" disabled><svg><use href="#i-danmaku"/></svg><span>弹幕</span><kbd>D</kbd></button>
            <button data-key="fullscreen" data-control="keyboard" disabled><svg><use href="#i-full"/></svg><span>全屏</span><kbd>F</kbd></button>
            <button data-key="escape" data-control="keyboard" disabled><svg><use href="#i-escape"/></svg><span>退出</span><kbd>Esc</kbd></button>
          </div>
        </section>

        <div class="side-panels">
          <section class="panel volume-panel" aria-label="系统音量">
            <div class="volume-header"><h2>音量</h2><output id="volume-value" for="volume-slider">—<span>%</span></output></div>
            <div class="slider-row"><svg class="slider-icon"><use href="#i-volume"/></svg><input id="volume-slider" type="range" min="0" max="100" value="0" aria-label="系统音量" disabled><svg class="slider-icon slider-loud"><use href="#i-volume"/></svg></div>
            <div class="volume-actions"><button id="volume-down" data-control="volume" disabled>− 10%</button><button id="mute-button" data-control="mute" disabled><svg><use id="mute-icon" href="#i-mute"/></svg><span id="mute-label">静音</span></button><button id="volume-up" data-control="volume" disabled>+ 10%</button></div>
            <p class="volume-note" id="volume-note" hidden>此设备不支持系统音量调节</p>
          </section>

          <section class="panel notification-panel" aria-label="通知管理">
            <button id="clear-notifications" class="clear-button" data-control="keyboard" disabled><span><svg><use href="#i-bell"/></svg><span id="clear-label">清除通知</span></span><svg><use href="#i-arrow"/></svg></button>
          </section>
        </div>
      </div>
    </main>

  </div>

  <div class="pairing-overlay" id="pairing-overlay" hidden>
    <section class="pairing-dialog" role="dialog" aria-modal="true" aria-labelledby="pairing-title">
      <span class="pairing-mark"><svg><use href="#i-remote"/></svg></span>
      <h2 id="pairing-title">连接 Mac</h2><p id="pairing-message">输入菜单栏中的配对码，或扫描二维码。</p>
      <form id="pairing-form"><label for="pairing-token">配对码或连接地址</label><input id="pairing-token" type="text" inputmode="numeric" placeholder="6 位数字配对码" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required><button type="submit" id="pairing-submit">连接<svg><use href="#i-links"/></svg></button></form>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
